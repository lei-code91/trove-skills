appId: com.trove.skills
productName: Trove Skills
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Trove Skills
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/